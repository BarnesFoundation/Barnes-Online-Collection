AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

# CS-67 HOSTING MOVE (monolith). Runs development's CURRENT app AS-IS on CloudFront + a single zip
# Lambda instead of Elastic Beanstalk — NO functionality changes. The FULL Express server runs on the
# Lambda (SSR meta/OG on / + object pages, canonical /objects/:id -> /objects/:id/<title-slug>/ 301s,
# /track/image-download GA+redirect, express.static of the built FE, AND /api/*), exactly as the EB
# container did. CloudFront is a single origin in front of the Lambda.
#
# Chosen over the FE/API split (S3 SPA + Lambda /api only): that split serves development's non-/api
# routes statically and silently regresses the SSR/canonical/tracking behavior — a functionality
# change. Offloading hashed static assets to S3 for edge caching is a later, separate optimization.
#
# Zip, not container (CS-64): no native deps; the server runs unchanged via the Lambda Web Adapter
# (run.sh -> node server/index.js) and the built FE (build/) rides in the package. VXP-safe: read-only
# + additive; does not touch the ElasticSearch write path; EB stays up for instant rollback.
Description: >
  Barnes Collection Online — CS-67: development's current app on CloudFront + a single zip Lambda
  (monolith), replacing Elastic Beanstalk. Pure hosting move, no functionality changes. Parameterized
  for dev/prod (two stacks, one account).

Parameters:
  EnvName:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deploy target. Drives resource names.

  DomainName:
    Type: String
    Default: ""
    Description: >
      Custom domain for the distribution (dev.collection.barnesfoundation.org /
      collection.barnesfoundation.org). LEAVE EMPTY to deploy a parallel test stack on the default
      *.cloudfront.net domain (no alias, no DNS, no CNAME conflict with the existing dev CloudFront).

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM cert in us-east-1 covering DomainName. Required only when DomainName is set. dev today:
      arn:aws:acm:us-east-1:744014450301:certificate/53e35848-685f-4892-b517-9b0a4818c64e

  # ---- Data layer (Postgres V2 via RDS Proxy; IAM auth, no password) — defaults match CS-55 ----
  PgHost:
    Type: String
    Default: collection-proxy.proxy-cra1dp6a1lpd.us-east-1.rds.amazonaws.com
  PgPort:
    Type: String
    Default: "5432"
  PgDatabase:
    Type: String
    Default: postgres
  PgSchema:
    Type: String
    Default: collection
  PgUser:
    Type: String
    Default: collection_reader
  RdsProxyResourceId:
    Type: String
    Default: prx-0eeb2d0b5fd9a37d3
    Description: RDS Proxy resource id, for the rds-db:connect grant (from CS-55).

  # ---- ElasticSearch (Elastic Cloud) — development's search + craft suggestions read from ES ----
  ElasticsearchHost:
    Type: String
    Default: 5e8337e9f81d465da3b4c143cd3d4c2b.us-east-1.aws.found.io
  ElasticsearchPort:
    Type: String
    Default: "9243"
  ElasticsearchProtocol:
    Type: String
    Default: https
  ElasticsearchIndex:
    Type: String
    Default: collection
  ElasticsearchUsername:
    Type: String
    Default: elastic

  # ---- Non-secret app config (defaults mirror EB env `collection-server-development`) ----
  GraphCmsEndpoint:
    Type: String
    Default: https://api-us-east-1.hygraph.com/v2/cl2kqpf8s0tsj01xr80ob95fo/master
  AwsBucket:
    Type: String
    Default: barnes-data-processing-production
    Description: S3 bucket the server signs/reads object downloads from (app.js s3.getSignedUrl/getObject).
  WwwUsername:
    Type: String
    Default: barnes
  ReactAppAwsBucket:
    Type: String
    Default: barnes-data-processing
  ReactAppCanonicalRoot:
    Type: String
    Default: http://dev.collection.barnesfoundation.org
  ReactAppGoogleAnalyticsId:
    Type: String
    Default: UA-25091665-17
  ReactAppImageBaseUrl:
    Type: String
    Default: https://d2r83x5xt28klo.cloudfront.net
  ReactAppNetxBaseUrl:
    Type: String
    Default: https://barnesfoundation.netx.net
  ReactAppNetxEnabled:
    Type: String
    Default: "true"
  ReactAppPrintsEndpoint:
    Type: String
    Default: https://prints.barnesfoundation.org/utility/object_reference_uri
  ReactAppWwwUrl:
    Type: String
    Default: https://www.barnesfoundation.org
  EnablePostgresV2:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Postgres V2 carousel renditions (CS-55). "false" omits the PG_* settings entirely, so the app's
      V2 read fails fast and it serves the primary image only, which is prod's behavior today (CS-55 is
      shipped but not activated on prod). Activating CS-55 on prod is its own, later step.
  WufooSubdomain:
    Type: String
    Default: ""
    Description: Image-download request form (POST /api/objects/:invno/download). Empty on dev, like the EB dev env.
  WufooDownloadForm:
    Type: String
    Default: ""
  WebAclArn:
    Type: String
    Default: ""
    Description: WAFv2 (CLOUDFRONT scope) web ACL to attach; prod uses the existing bot-blocker ACL. Empty = none.
  NodeEnvValue:
    Type: String
    Default: development
    Description: >
      development on dev, production on prod (mirrors each EB env). With NODE_ENV=production the app
      enforces an HTTPS redirect (via X-CF-Proto / X-Forwarded-Proto) and rejects any request whose
      `x-cf-secret` header != a literal hardcoded in server/app.js. CloudFront sends both (see the
      origin's custom headers); the X-CF-Secret value lives in the secret as X_CF_SECRET.

  # ---- Secrets: NOT parameters. They live in AWS Secrets Manager as `barnes-collection-www/<EnvName>`
  # (JSON keys ELASTICSEARCH_PASSWORD, GRAPHCMS_API_TOKEN, NETX_API_TOKEN, WUFOO_USERNAME, WUFOO_PASSWORD, WWW_PASSWORD,
  # X_CF_SECRET, X_ORIGIN_VERIFY; every env's secret carries all keys, unused ones hold a placeholder)
  # and are read below via {{resolve:secretsmanager:...}} dynamic references, so a deploy (local or CI)
  # passes no secrets at all. The deploying principal needs secretsmanager:GetSecretValue on it.
  # CloudFormation re-reads a secret only when the resource using it changes — after rotating a value,
  # redeploy with a template/parameter change to pick it up.
  # AWS_ACCESS_KEY / AWS_SECRET_KEY are intentionally absent — Lambda-reserved env keys; the app uses the
  # Lambda execution role instead.

  # ---- Networking (Lambda must be in-VPC to reach the RDS Proxy; needs NAT egress to ES + Craft) ----
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with NAT egress (ES on Elastic Cloud + Craft CMS) AND reach to the RDS Proxy (subnet-021d7a72948b68fb1 us-east-1f + subnet-032319d3c76379c66 us-east-1a, see infra/lambda-network.yaml).
  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: SG(s) allowing egress to the RDS Proxy (5432), ES, and AWS endpoints (dev sg-2480035b).

  LwaLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerX86:24
    Description: AWS Lambda Web Adapter layer (public, us-east-1/x86_64). Pin at deploy.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  # The cert is decoupled from the alias so a distribution can hold the cert BEFORE it takes the alias,
  # which is what CloudFront's zero-downtime `associate-alias` move requires (see DEPLOY.md, cutover).
  HasCertificate: !Not [!Equals [!Ref AcmCertificateArn, ""]]
  UsePostgresV2: !Equals [!Ref EnablePostgresV2, "true"]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 1536
    Runtime: nodejs22.x
    Architectures: [x86_64]

Resources:
  # ================================================================================================
  # The whole app — one zip Lambda on nodejs22.x running the unchanged Express server via the LWA.
  # CodeUri points at a PRE-CURATED package dir built by scripts/package-lambda.sh: server/ + src/ +
  # scripts/ + run.sh + package.json + the built FE (build/) + prod-only node_modules. Both the
  # CFN-native `aws cloudformation package` path and a future `sam build/deploy` zip this same dir
  # (no .samignore needed — the dir is already trimmed). Run scripts/package-lambda.sh before deploy.
  # ================================================================================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "barnes-collection-www-${EnvName}"
      CodeUri: lambda-pkg/
      Handler: run.sh
      Layers:
        - !Ref LwaLayerArn
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Environment:
        Variables:
          # Lambda Web Adapter wiring
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          # gzip/br at the origin, like the nginx proxy in front of the app on Elastic Beanstalk. CloudFront
          # can't compress /api/* (an uncached behavior), so this is what compresses search responses.
          AWS_LWA_ENABLE_COMPRESSION: "true"
          PORT: "8080"
          NODE_ENV: !Ref NodeEnvValue
          # Postgres V2 (IAM auth, no password). Omitted entirely when EnablePostgresV2=false.
          PG_HOST: !If [UsePostgresV2, !Ref PgHost, !Ref "AWS::NoValue"]
          PG_PORT: !If [UsePostgresV2, !Ref PgPort, !Ref "AWS::NoValue"]
          PG_DATABASE: !If [UsePostgresV2, !Ref PgDatabase, !Ref "AWS::NoValue"]
          PG_SCHEMA: !If [UsePostgresV2, !Ref PgSchema, !Ref "AWS::NoValue"]
          PG_USER: !If [UsePostgresV2, !Ref PgUser, !Ref "AWS::NoValue"]
          PG_IAM_AUTH: !If [UsePostgresV2, "true", !Ref "AWS::NoValue"]
          # ElasticSearch (Elastic Cloud)
          ELASTICSEARCH_HOST: !Ref ElasticsearchHost
          ELASTICSEARCH_PORT: !Ref ElasticsearchPort
          ELASTICSEARCH_PROTOCOL: !Ref ElasticsearchProtocol
          ELASTICSEARCH_INDEX: !Ref ElasticsearchIndex
          ELASTICSEARCH_USERNAME: !Ref ElasticsearchUsername
          ELASTICSEARCH_PASSWORD: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:ELASTICSEARCH_PASSWORD}}"
          # Craft CMS (Hygraph/GraphCMS)
          GRAPHCMS_ENDPOINT: !Ref GraphCmsEndpoint
          GRAPHCMS_API_TOKEN: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:GRAPHCMS_API_TOKEN}}"
          # NetX DAMS
          NETX_API_TOKEN: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:NETX_API_TOKEN}}"
          # AWS SDK credentials come from the Lambda EXECUTION ROLE (below), not static keys:
          # AWS_ACCESS_KEY / AWS_SECRET_KEY / AWS_REGION are Lambda-reserved and cannot be set here.
          # AWS_REGION is auto-provided by the runtime; only the bucket name is app config.
          AWS_BUCKET: !Ref AwsBucket
          # Wufoo image-download request form (app.js POST /api/objects/:invno/download)
          WUFOO_SUBDOMAIN: !Ref WufooSubdomain
          WUFOO_DOWNLOAD_FORM: !Ref WufooDownloadForm
          WUFOO_USERNAME: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:WUFOO_USERNAME}}"   # the Wufoo API key
          WUFOO_PASSWORD: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:WUFOO_PASSWORD}}"
          # WWW basic-auth pair for the Craft API (craftService.js; used when NODE_ENV != production)
          WWW_USERNAME: !Ref WwwUsername
          WWW_PASSWORD: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:WWW_PASSWORD}}"
          # App config + REACT_APP_* the server reads at runtime (mirror of EB dev)
          X_ORIGIN_VERIFY: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:X_ORIGIN_VERIFY}}"
          REACT_APP_AWS_BUCKET: !Ref ReactAppAwsBucket
          REACT_APP_CANONICAL_ROOT: !Ref ReactAppCanonicalRoot
          REACT_APP_GOOGLE_ANALYTICS_ID: !Ref ReactAppGoogleAnalyticsId
          REACT_APP_IMAGE_BASE_URL: !Ref ReactAppImageBaseUrl
          REACT_APP_NETX_BASE_URL: !Ref ReactAppNetxBaseUrl
          REACT_APP_NETX_ENABLED: !Ref ReactAppNetxEnabled
          REACT_APP_PRINTS_ENDPOINT: !Ref ReactAppPrintsEndpoint
          REACT_APP_WWW_URL: !Ref ReactAppWwwUrl
      Policies:
        - Statement:
            # RDS Proxy IAM auth — the execution role signs the short-lived DB token (pgClient.js).
            - Sid: RdsIamConnect
              Effect: Allow
              Action: rds-db:connect
              Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RdsProxyResourceId}/${PgUser}"
            # S3 — the app signs/reads object downloads (app.js s3.getSignedUrl/getObject) via the role
            # (was the static IAM user on EB; same access, sourced from the role in Lambda).
            - Sid: S3ReadCollectionAssets
              Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "arn:aws:s3:::${AwsBucket}/*"
            - Sid: S3ListCollectionAssets
              Effect: Allow
              Action: [s3:ListBucket]
              Resource: !Sub "arn:aws:s3:::${AwsBucket}"
        # VPC ENI management is added automatically by SAM when VpcConfig is set.
      FunctionUrlConfig:
        # AuthType NONE, NOT AWS_IAM/OAC. CloudFront OAC signs SigV4, but a Lambda function URL rejects
        # SigV4 on POST/PUT requests that carry a body ("signature does not match") — a known OAC+Lambda
        # limitation that broke POST /api/search (the object grid; GET signs fine). So the URL is public
        # and the origin is gated by the X-Origin-Verify secret header CloudFront injects (below). PROD:
        # the app must enforce that header (see NodeEnvValue note); on dev it does not, so the raw
        # function URL is directly reachable — acceptable for a dev preview of public collection data.
        AuthType: NONE
        InvokeMode: BUFFERED

  # ================================================================================================
  # CloudFront — single origin: the Lambda Function URL (the whole app). No S3 origin, no SPA-rewrite
  # function; the Express server does its own routing + static, exactly like EB.
  # ================================================================================================
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Barnes Collection Online — monolith on Lambda (${EnvName})"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref "AWS::NoValue"]
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCertificate
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: lambda-app
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:X_ORIGIN_VERIFY}}"
              # What the app checks when NODE_ENV=production (mirrors the current prod CloudFront).
              - HeaderName: X-CF-Secret
                HeaderValue: !Sub "{{resolve:secretsmanager:barnes-collection-www/${EnvName}:SecretString:X_CF_SECRET}}"
              - HeaderName: X-CF-Proto
                HeaderValue: https
              - HeaderName: X-Forwarded-Proto
                HeaderValue: https
        DefaultCacheBehavior:
          TargetOriginId: lambda-app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          Compress: true   # the current prod CloudFront compresses every behavior
          # Honor the app's own Cache-Control (what the current prod CloudFront does); no header, no cache.
          CachePolicyId: !Ref OriginCacheControlPolicy
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt QueryStringEncodeFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: lambda-app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt QueryStringEncodeFunction.FunctionMetadata.FunctionARN
          # CRA's build/static/* files are content-hashed, so they are immutable: cache them at the edge for
          # a year. Otherwise every JS/CSS request on a page load hits (and may cold-start) the Lambda.
          - PathPattern: /static/*
            TargetOriginId: lambda-app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref ImmutableAssetsPolicy
            Compress: true

  # A Lambda function URL answers 400 (empty body) to a query string with a raw { } | ^ ` \ " < >.
  # Browsers leave { } | ^ ` \ unencoded, and the site's own filter links put raw JSON in `qval`
  # (/objects/?qtype=filter&qval={...}), so artist links, reloads and shared/bookmarked search URLs all
  # 400'd after the cutover (EB accepted them). Percent-encode those characters at the edge; the app
  # decodes them as before.
  QueryStringEncodeFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "barnes-collection-www-${EnvName}-encode-querystring"
      AutoPublish: true
      FunctionConfig:
        Comment: Percent-encode query-string characters a Lambda function URL rejects.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function enc(s) {
          return s.replace(/[{}|^`\\"<>]/g, function (c) {
            return "%" + c.charCodeAt(0).toString(16).toUpperCase();
          });
        }
        function handler(event) {
          var q = event.request.querystring, out = {};
          for (var k in q) {
            var v = q[k], nv = { value: enc(v.value) };
            if (v.multiValue) nv.multiValue = v.multiValue.map(function (m) { return { value: enc(m.value) }; });
            out[enc(k)] = nv;
          }
          event.request.querystring = out;
          return event.request;
        }

  # Cache key / TTLs for the default behavior. Deliberately NOT a managed policy: those put the Host
  # header in the cache key, which forwards the viewer Host to the origin, and a Lambda function URL
  # rejects requests for a Host it doesn't own.
  OriginCacheControlPolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "barnes-collection-www-${EnvName}-origin-cache-control"
        Comment: Honor origin Cache-Control; no Host in the key (Lambda function URL origin).
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  ImmutableAssetsPolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "barnes-collection-www-${EnvName}-immutable-assets"
        Comment: Content-hashed build assets (/static/*), cached for a year regardless of origin headers.
        MinTTL: 31536000
        DefaultTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Description: Verify the stack here first; point the DomainName DNS record here after verifying.
  ApiFunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  ApiFunctionName:
    Value: !Ref ApiFunction
