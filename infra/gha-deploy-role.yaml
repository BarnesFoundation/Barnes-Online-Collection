AWSTemplateFormatVersion: "2010-09-09"

# CS-78 — the IAM role GitHub Actions assumes to deploy the collection site's Lambda stack (template.yaml).
# Auth is GitHub OIDC (no stored AWS keys): only workflow runs on the listed branch refs of this repo can
# assume it. Uses the account's existing token.actions.githubusercontent.com OIDC provider (shared — also
# used by thebarn-es-redirect). One stack per env, deployed by hand, and again only when the allowed
# subjects or permissions change:
#
#   dev:  aws cloudformation deploy --stack-name barnes-online-collection-gha-deploy-dev \
#           --template-file infra/gha-deploy-role.yaml --capabilities CAPABILITY_NAMED_IAM \
#           --parameter-overrides DistributionId=E22AQ2LQ5QLAAK
#   prod: aws cloudformation deploy --stack-name barnes-online-collection-gha-deploy-prod \
#           --template-file infra/gha-deploy-role.yaml --capabilities CAPABILITY_NAMED_IAM \
#           --parameter-overrides EnvName=prod AppStackName=barnes-collection-www-prod \
#             WebAclArn=<prod web ACL ARN> CreateArtifactsBucket=false \
#             "AllowedSubjects=repo:BarnesFoundation/Barnes-Online-Collection:environment:production,repo:barnesfoundation/barnes-online-collection:environment:production"
#         then, after the first prod deploy creates the distribution, redeploy with DistributionId=<id>.
#
# Prod trusts ONLY jobs running in the GitHub "production" Environment (whose required reviewer is Steve),
# so AWS credentials for prod exist only after that approval.
#
# Permissions are scoped to the dev app stack's own resources (stack, function, its generated execution
# role, its CloudFront distribution, its secret). Hardening follow-up: a permissions boundary on the
# function role, since this role can create roles named <AppStackName>-*.
Description: GitHub Actions OIDC deploy role for Barnes Collection Online (dev Lambda stack) + artifacts bucket.

Parameters:
  AllowedSubjects:
    Type: CommaDelimitedList
    # GitHub's OIDC `sub` is repo:<owner>/<repo>:ref:<ref> (a branch run or a release run at its tag) or
    # repo:<owner>/<repo>:environment:<name> (a job in an Environment). The dev default trusts manual runs
    # on main and pre-release runs at v* tags; prod passes environment:production. Both case
    # spellings of the repo are listed because the IAM match is case-sensitive.
    Default: "repo:BarnesFoundation/Barnes-Online-Collection:ref:refs/heads/main,repo:barnesfoundation/barnes-online-collection:ref:refs/heads/main,repo:BarnesFoundation/Barnes-Online-Collection:ref:refs/tags/v*,repo:barnesfoundation/barnes-online-collection:ref:refs/tags/v*"
  AppStackName:
    Type: String
    Default: barnes-collection-www-dev
  EnvName:
    Type: String
    Default: dev
  DistributionId:
    Type: String
    Default: ""
    Description: >
      CloudFront distribution the app stack owns (its DistributionId output); dev = E22AQ2LQ5QLAAK.
      Leave empty only to bootstrap an env whose distribution doesn't exist yet: the role may then create
      and manage distributions account-wide. Pin it right after the first deploy.
  WebAclArn:
    Type: String
    Default: ""
    Description: WAFv2 web ACL the app stack attaches to its distribution (prod); empty = none.
  CreateArtifactsBucket:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: The artifacts bucket is shared across envs; only the dev role stack creates it.
  LwaLayerAccount:
    Type: String
    Default: "753240598075"
    Description: AWS account that publishes the Lambda Web Adapter layer.

Conditions:
  PinnedDistribution: !Not [!Equals [!Ref DistributionId, ""]]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]
  OwnsArtifactsBucket: !Equals [!Ref CreateArtifactsBucket, "true"]

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Condition: OwnsArtifactsBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "barnes-online-collection-deploy-artifacts-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-lambda-packages
            Status: Enabled
            ExpirationInDays: 30

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "barnes-online-collection-gha-deploy-${EnvName}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref AllowedSubjects
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # `aws cloudformation package` uploads the Lambda zip here.
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::barnes-online-collection-deploy-artifacts-${AWS::AccountId}/*"
              - Sid: ArtifactsList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::barnes-online-collection-deploy-artifacts-${AWS::AccountId}"

              # Create/execute change sets on the app stack (+ the SAM transform it uses).
              - Sid: AppStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: CfnRead
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: "*"

              # The app function itself.
              - Sid: Function
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:CreateFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                  # read/update calls the CloudFormation Lambda resource handler makes
                  - lambda:ListVersionsByFunction
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:PutRuntimeManagementConfig
                  - lambda:GetFunctionRecursionConfig
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:barnes-collection-www-${EnvName}"
              - Sid: WebAdapterLayer
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${LwaLayerAccount}:layer:LambdaAdapterLayer*"

              # The execution role SAM generates for the function (named <stack>-ApiFunctionRole-<suffix>).
              - Sid: FunctionRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
              - Sid: FunctionRoleManagedPolicies
                Effect: Allow
                Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN:
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
              - Sid: PassFunctionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

              # Lambda validates the VPC config against the caller's EC2 read access.
              - Sid: VpcRead
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"

              # The app stack's CloudFront distribution. Pinned to its id once it exists; while bootstrapping
              # (DistributionId empty) the role may create one and manage distributions account-wide.
              - Sid: Distribution
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  # post-deploy invalidation (the workflows clear the edge cache before smoke-testing)
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !If
                  - PinnedDistribution
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              - !If
                - PinnedDistribution
                - !Ref "AWS::NoValue"
                - Sid: BootstrapCreateDistribution
                  Effect: Allow
                  Action: cloudfront:CreateDistribution
                  Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              # The stack's own CloudFront Functions (e.g. the query-string encoder), scoped by name.
              - Sid: CloudFrontFunctions
                Effect: Allow
                Action:
                  - cloudfront:CreateFunction
                  - cloudfront:DescribeFunction
                  - cloudfront:GetFunction
                  - cloudfront:UpdateFunction
                  - cloudfront:PublishFunction
                  - cloudfront:DeleteFunction
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:function/barnes-collection-www-${EnvName}-*"
              # The stack's own cache policies (CloudFront can't scope these by name).
              - Sid: CachePolicies
                Effect: Allow
                Action:
                  - cloudfront:CreateCachePolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetCachePolicyConfig
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:DeleteCachePolicy
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:cache-policy/*"
              # Attaching a WAF web ACL to the distribution requires reading it.
              - !If
                - HasWebAcl
                - Sid: WebAcl
                  Effect: Allow
                  Action: [wafv2:GetWebACL]
                  Resource: !Ref WebAclArn
                - !Ref "AWS::NoValue"

              # CloudFormation resolves the template's {{resolve:secretsmanager:...}} references with the
              # deployer's credentials.
              - Sid: AppSecret
                Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:DescribeSecret]
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:barnes-collection-www/${EnvName}-*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Set as role-to-assume in .github/workflows/deploy-dev.yml.
  ArtifactsBucketName:
    Value: !Sub "barnes-online-collection-deploy-artifacts-${AWS::AccountId}"
